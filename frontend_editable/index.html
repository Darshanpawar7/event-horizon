<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23212121'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23FF6600' stroke-width='3'/%3E%3C/svg%3E" />
    <meta name="description" content="Crowd intelligence for live venues: a 3D venue digital twin, a constant-velocity concentration forecast, deterministic incident rules and an evidence-bounded operator assistant." />
    <meta name="theme-color" content="#212121" />
    <title>Event Horizon | Venue resilience twin</title>
    <style>
      /* Static splash shown until the React bundle has executed. React replaces it on mount. */
      .boot { height: 100%; display: grid; place-items: center; background: #e8eaeb; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .boot-card { border: 2px solid #212121; background: #fff; box-shadow: 4px 4px 0 0 #212121; padding: 18px 22px; }
      .boot-eyebrow { color: #ff6600; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; }
      .boot-title { color: #212121; font-size: 16px; font-weight: 900; margin-top: 6px; letter-spacing: -0.02em; }
      .boot-note { color: #6b7280; font-size: 9px; margin-top: 8px; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-eyebrow">EVENT HORIZON / CROWD INTELLIGENCE</div>
          <div class="boot-title">LOADING OPERATOR CONSOLE…</div>
          <div class="boot-note">NOTHING HERE ESTABLISHES CROWD SAFETY</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
